name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MaslakGPS-debug-apk
          path: app/build/outputs/apk/maslak/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Marwani-debug-apk
          path: app/build/outputs/apk/marwani/debug/*.apk
